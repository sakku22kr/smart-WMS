server:
  port: ${PORT:8080}

spring:
  application:
    name: smart-wms-api

  datasource:
    url: ${DATABASE_URL:jdbc:mysql://localhost:3306/smart_wms?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      connection-timeout: 20000
      minimum-idle: 2
      maximum-pool-size: ${DB_POOL_SIZE:10}
      idle-timeout: 300000
      max-lifetime: 1200000
      auto-commit: true
      pool-name: SmartWmsHikariPool

  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
        use_sql_comments: true
        jdbc:
          batch_size: 25
        order_inserts: true
        order_updates: true
        generate_statistics: false

  mvc:
    throw-exception-if-no-handler-found: true

  servlet:
    multipart:
      enabled: true
      max-file-size: 5MB
      max-request-size: 5MB

  web:
    resources:
      add-mappings: true
      static-locations: classpath:/static/,file:uploads/

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
        debug: false
    default-encoding: UTF-8

# ─── Application Config ────────────────────────────────────────
app:
  jwt:
    secret: ${JWT_SECRET:c21hcnR3bXNzdXBlcnNlY3JldGtleWZvcmpzb253ZWJ0b2tlbnNpZ25pbmcyMDI1}
    expiration: ${JWT_EXPIRY_MS:86400000}
    refresh-expiration: ${JWT_REFRESH_EXPIRY_MS:604800000}

  cors:
    # Comma-separated list of allowed origins — include your Vercel frontend URL in production
    # Example: https://smart-wms.vercel.app,https://www.smartwms.io
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173,http://localhost:3000}
    allowed-methods: GET,POST,PUT,PATCH,DELETE,OPTIONS
    max-age: 3600

  mail:
    from: ${MAIL_FROM:noreply@smartwms.io}
    from-name: ${MAIL_FROM_NAME:Smart WMS}
    password-reset-expiry-minutes: 15
    verification-expiry-hours: 24

  frontend-url: ${FRONTEND_URL:http://localhost:5173}

# ─── SpringDoc / Swagger ────────────────────────────────────────
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true
    disable-swagger-default-url: true
    try-it-out-enabled: true

# ─── Actuator ──────────────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

# ─── Logging ───────────────────────────────────────────────────
logging:
  level:
    com.smartwms: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
    org.hibernate.type.descriptor.sql: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [%logger{36}] - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [%logger{36}] - %msg%n"
  logback:
    rollingpolicy:
      max-file-size: 100MB
      max-history: 30
  file:
    name: logs/smart-wms.log
